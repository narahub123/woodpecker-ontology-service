name: Close Issues on Development Merge

on:
  pull_request:
    branches:
      - development
    types:
      - closed

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  close-linked-issues:
    name: Close Linked Issues
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Close linked issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const prBody = context.payload.pull_request.body || '';
            const issuePattern = /(?:closes?|fixes?|resolves?)\s+#?(\d+)/gi;
            const matches = [...prBody.matchAll(issuePattern)];

            if (matches.length === 0) {
              console.log(
                'PR 본문에서 연결된 이슈를 찾을 수 없습니다. "closes #이슈번호" 형식으로 작성하세요.',
              );
              return;
            }

            const issueNumbers = [
              ...new Set(matches.map((match) => parseInt(match[1], 10))),
            ];

            for (const issueNumber of issueNumbers) {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              if (issue.data.pull_request) {
                console.log(
                  `#${issueNumber}은 이슈가 아니라 Pull Request이므로 건너뜁니다.`,
                );
                continue;
              }

              if (issue.data.state === 'closed') {
                console.log(`이슈 #${issueNumber}은 이미 닫혀 있습니다.`);
                continue;
              }

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
              });

              console.log(`이슈 #${issueNumber} 닫기 완료`);
            }
